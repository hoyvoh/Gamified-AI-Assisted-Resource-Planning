database_url: "sqlite+aiosqlite:///./dev.db"
secret_key: "change-me-in-production"
debug: false

llm:
  cli_tool: "claude"           # "claude" | "codex" — must be on PATH and authenticated
  model: "claude-sonnet-4-6"   # passed via --model flag when supported
  timeout_seconds: 120         # max seconds to wait for LLM CLI response
  max_retries: 2               # retries on transient subprocess failures

analysis:
  max_period_days: 365         # maximum allowed analysis period length
  scoring_version: "1.0"       # scoring algorithm version tag
  taxonomy_version: "1.0"      # dimension taxonomy version tag
  github_timeout_seconds: 60   # per-command timeout for gh CLI calls
