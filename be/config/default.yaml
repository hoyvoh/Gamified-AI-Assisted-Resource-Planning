database_url: "sqlite+aiosqlite:///./dev.db"
secret_key: "change-me-in-production"
debug: true

logging:
  # App logger level — controls what 'app.*' modules emit.
  # "DEBUG"   → every step: LLM prompts/responses, chunk sizes, per-dimension results
  # "INFO"    → key milestones only: phase start/end, record counts, errors
  # "WARNING" → errors and warnings only
  level: "DEBUG"

  # SQLAlchemy engine verbosity.
  # "INFO"    → prints every SQL statement (useful for query debugging)
  # "WARNING" → suppresses all SQL output (cleaner logs during normal operation)
  sql_level: "WARNING"

  # Output format.
  # "text" → human-readable console lines
  # "json" → one JSON object per line (for log aggregators like Datadog, Loki)
  format: "text"

llm:
  provider: "claude" # "claude" | "codex" — must be on PATH and authenticated
  model: "claude-sonnet-4-6" # passed via --model flag when supported
  timeout_seconds: 120 # max seconds to wait for LLM CLI response
  max_retries: 2 # retries on transient subprocess failures

analysis:
  max_period_days: 365 # maximum allowed analysis period length
  scoring_version: "1.0" # scoring algorithm version tag
  taxonomy_version: "1.0" # dimension taxonomy version tag
  github_timeout_seconds: 60 # per-command timeout for gh CLI calls
